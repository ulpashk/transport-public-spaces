replicaCount: 1

image:
  repository: git-ci-cd.smartalmaty.kz:8443/opendata/transport-public-spaces
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets:
  - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext: {}

securityContext: {}

service:
  type: ClusterIP
  port: 80


ingress:
  enabled: false
  annotations:
    kubernetes.io/ingress.class: nginx
#    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
#    nginx.ingress.kubernetes.io/rewrite-target: /$2
  hosts:
    - host: od.smartalmaty.kz
      paths:
        - path: /transport-public-spaces(/|$)(.*)
          pathType: ImplementationSpecific



resources:
  requests:
    cpu: 0.2
    memory: 256Mi
  limits:
    cpu: 1
    memory: 2048Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

nodeSelector: {}

tolerations: []
affinity: {}

#pvc:
#  enabled: false
#  pvcname: media
#  pvcpatch: /media
