  <rect x="7.5" y="20" width="1" height="4" fill="#A3A3A3"/>
  
  <!-- Автобус -->
  <rect x="16" y="14" width="12" height="8" fill="#3B82F6" rx="2"/>
  <!-- Окна автобуса -->
  <rect x="17" y="15" width="2" height="2" fill="#E5E7EB" rx="0.5"/>
  <rect x="20" y="15" width="2" height="2" fill="#E5E7EB" rx="0.5"/>
  <rect x="23" y="15" width="2" height="2" fill="#E5E7EB" rx="0.5"/>
